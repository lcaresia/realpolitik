<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<title>Thank you · Realpolitik</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Fraunces:opsz,wght@9..144,600&family=Mulish:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="store.css">
<script defer src="https://cloud.umami.is/script.js" data-website-id="94b2eaf2-74db-4f6b-a85e-c10ef7b3573b" data-exclude-search="true"></script>
</head>
<body>
<header><div><a class="b" href="index.html">REALPOLITIK</a><a href="index.html" data-t="back"></a></div></header>
<main>
  <h1 data-t="thanksH"></h1>
  <div id="wait"><p><span class="spin"></span><span data-t="waiting"></span></p><p class="note" id="slow" hidden data-t="slow"></p></div>
  <div id="ok" hidden>
    <p data-t="thanksP"></p>
    <div class="note" data-t="keyLbl"></div>
    <div class="key"><code id="key"></code><button class="ghost" id="copy" data-t="copy"></button><button class="ghost" id="save" data-t="saveTxt"></button></div>
    <p class="note" data-t="saveHint"></p>
    <p class="note" data-t="where"></p>
    <p class="note" id="norefund" hidden data-t="noRefund"></p>
    <h2 data-t="dlH"></h2>
    <div id="dl"></div>
    <p class="note"><a href="install.html" data-t="install"></a></p>
  </div>
  <p class="msg err" id="err" hidden></p>
</main>
<footer><div>Unofficial fan-made mod. Not affiliated with or endorsed by Amplitude Studios or SEGA. HUMANKIND is a trademark of its respective owners.</div></footer>
<script src="store.js"></script>
<script>
(function () {
  var t = RP.t; RP.fillText();
  // The session id stays out of the address bar and history after the first load.
  var q = new URLSearchParams(location.search), sid = q.get('session_id');
  try { if (sid) sessionStorage.setItem('rp-sid', sid); else sid = sessionStorage.getItem('rp-sid'); } catch (e) {}
  history.replaceState(null, '', 'obrigado.html');
  var $ = function (id) { return document.getElementById(id); };
  function fail(msg) { $('wait').hidden = true; $('err').hidden = false; $('err').textContent = msg; }
  if (!sid) return fail(t.expired);
  var tries = 0;
  (function poll() {
    RP.api('GET', '/api/order?session_id=' + encodeURIComponent(sid)).then(function (j) {
      if (j._status === 202) { if (++tries === 15) $('slow').hidden = false; return setTimeout(poll, 2000); }
      if (j._status === 410) return fail(t.expired);
      if (j._status !== 200) return fail(RP.errorText(j));
      $('wait').hidden = true; $('ok').hidden = false;
      $('key').textContent = j.key;
      if (j.prior_refund) $('norefund').hidden = false;
      $('copy').onclick = function () { navigator.clipboard.writeText(j.key).then(function () { $('copy').textContent = t.copied; }); };
      $('save').onclick = function () {
        var txt = 'Realpolitik: Living Nations for HUMANKIND\r\nLicense key: ' + j.key + '\r\nDownloads: ' + location.origin + '/download.html\r\n';
        var a = document.createElement('a');
        a.href = URL.createObjectURL(new Blob([txt], { type: 'text/plain' }));
        a.download = 'realpolitik-license.txt'; document.body.appendChild(a); a.click(); a.remove();
      };
      return RP.api('POST', '/api/download/list', { code: j.code }).then(function (d) { RP.renderDownloads($('dl'), d); });
    }).catch(function () { setTimeout(poll, 4000); });
  })();
})();
</script>
<script>window.addEventListener('load', function () { try { if (window.umami) window.umami.track('purchase_thanks'); } catch (e) {} });</script>
</body>
</html>
