<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<title>Download · Realpolitik</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Fraunces:opsz,wght@9..144,600&family=Mulish:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="store.css">
</head>
<body>
<header><div><a class="b" href="index.html">REALPOLITIK</a><a href="index.html" data-t="back"></a></div></header>
<main>
  <h1 data-t="dlH"></h1>
  <p id="intro" data-t="dlP"></p>
  <p class="msg" id="msg"></p>
  <div id="dl"></div>
  <form id="keyForm">
    <input id="keyIn" autocomplete="off" spellcheck="false" data-ph="keyPh" aria-label="License key">
    <button type="submit" data-t="show"></button>
  </form>
  <h2 data-t="lostH"></h2>
  <p class="note" data-t="lostP"></p>
  <form id="recForm">
    <input id="mailIn" type="email" autocomplete="email" data-ph="emailPh" aria-label="Email">
    <input id="recIn" autocomplete="off" spellcheck="false" data-ph="receiptPh" aria-label="Receipt number">
    <button type="submit" class="ghost" data-t="show"></button>
  </form>
  <p class="msg" id="recMsg"></p>
  <div class="key" id="recKey" hidden><code id="recKeyTxt"></code></div>
  <p class="note"><a href="install.html" data-t="install"></a></p>
</main>
<footer><div>Unofficial fan-made mod. Not affiliated with or endorsed by Amplitude Studios or SEGA. HUMANKIND is a trademark of its respective owners.</div></footer>
<script src="store.js"></script>
<script>
(function () {
  var t = RP.t; RP.fillText();
  var $ = function (id) { return document.getElementById(id); };
  function show(j) {
    $('msg').className = 'msg'; $('msg').textContent = '';
    if (j._status === 200 || j._status === 503) { RP.renderDownloads($('dl'), j); return true; }
    $('msg').className = 'msg err'; $('msg').textContent = RP.errorText(j); return false;
  }
  // Opened from the game or an email: /download.html#t=CODE (one-time, never sent to the server as part of the URL).
  window.addEventListener('hashchange', function () { location.reload(); }); // a new link while the page is already open
  var m = /[#&]t=([0-9a-f]{48})/.exec(location.hash);
  history.replaceState(null, '', 'download.html' + location.search);
  if (m) {
    $('msg').innerHTML = '<span class="spin"></span>';
    RP.api('POST', '/api/download/list', { code: m[1] }).then(function (j) { if (show(j)) $('keyForm').hidden = true; });
  }
  $('keyForm').onsubmit = function (e) {
    e.preventDefault();
    var k = $('keyIn').value.trim(); if (!k) return;
    $('msg').innerHTML = '<span class="spin"></span>';
    RP.api('POST', '/api/download/list', { key: k }).then(show);
  };
  // Lost key: purchase email + receipt number from Stripe's own receipt email.
  $('recForm').onsubmit = function (e) {
    e.preventDefault();
    var em = $('mailIn').value.trim(), rc = $('recIn').value.trim(); if (!em || !rc) return;
    $('recMsg').className = 'msg'; $('recMsg').innerHTML = '<span class="spin"></span>';
    RP.api('POST', '/api/recover', { email: em, receipt: rc }).then(function (j) {
      if (j._status !== 200) { $('recMsg').className = 'msg err'; $('recMsg').textContent = RP.errorText(j); return; }
      $('recMsg').textContent = t.saveHint;
      $('recKeyTxt').textContent = j.key; $('recKey').hidden = false;
      RP.api('POST', '/api/download/list', { code: j.code }).then(show);
    });
  };
})();
</script>
</body>
</html>
